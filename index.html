<!doctype html>
<html lang="uz"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Jasur Cafe — Menu</title>
<style>
body{margin:0;font-family:Arial;background:#f6f6f6;color:#222}header{background:#111;color:#fff;text-align:center;padding:28px 16px}
.wrap{max-width:720px;margin:auto;padding:16px}.cats{display:flex;gap:8px;overflow:auto;background:#fff;padding:12px;position:sticky;top:0}
button{border:0;border-radius:10px;padding:10px 14px}.active{background:#111;color:#fff}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:16px}
.card{background:#fff;border-radius:16px;overflow:hidden;box-shadow:0 2px 10px #0001}.card img{width:100%;height:150px;object-fit:cover}.info{padding:12px}
h3{margin:0 0 6px}.desc{color:#777;font-size:13px;min-height:32px}.price{font-weight:bold;font-size:17px}
@media(max-width:480px){.card img{height:125px}}
</style></head><body>
<header><h1 id="cafe">Jasur Cafe</h1><p>Хуш келибсиз!</p></header>
<div class="cats"><button class="active" onclick="filter('all',this)">Барчаси</button><button onclick="filter('hot',this)">Таомлар</button><button onclick="filter('fast',this)">Fast Food</button><button onclick="filter('drink',this)">Ичимликлар</button></div>
<div class="wrap"><div id="menu" class="grid"></div></div>
<script>
const fallback=[
{name:"Ош",price:"35 000 сўм",cat:"hot",desc:"Анъанавий ўзбек палови",img:"https://images.unsplash.com/photo-1601050690597-df0568f70950?auto=format&fit=crop&w=700&q=80"},
{name:"Шашлик",price:"25 000 сўм",cat:"hot",desc:"Мазали гўштли шашлик",img:"https://images.unsplash.com/photo-1544025162-d76694265947?auto=format&fit=crop&w=700&q=80"},
{name:"Бургер",price:"30 000 сўм",cat:"fast",desc:"Гўштли бургер",img:"https://images.unsplash.com/photo-1568901346375-23c9450c58cd?auto=format&fit=crop&w=700&q=80"},
{name:"Пицца",price:"65 000 сўм",cat:"fast",desc:"Пишлоқли пицца",img:"https://images.unsplash.com/photo-1574071318508-1cdbab80d002?auto=format&fit=crop&w=700&q=80"},
{name:"Кола",price:"12 000 сўм",cat:"drink",desc:"Совуқ ичимлик",img:"https://images.unsplash.com/photo-1629203849820-fdd70d49c38e?auto=format&fit=crop&w=700&q=80"},
{name:"Кофе",price:"18 000 сўм",cat:"drink",desc:"Иссиқ қаҳва",img:"https://images.unsplash.com/photo-1495474472287-4d71bcdd2085?auto=format&fit=crop&w=700&q=80"}];
let items=JSON.parse(localStorage.getItem("jasurMenuV4")||"null")||fallback;
function render(cat="all"){menu.innerHTML=items.filter(x=>cat==="all"||x.cat===cat).map(x=>`<article class="card"><img src="${x.img}"><div class="info"><h3>${x.name}</h3><div class="desc">${x.desc}</div><div class="price">${x.price}</div></div></article>`).join("")}
function filter(cat,b){document.querySelectorAll(".cats button").forEach(x=>x.classList.remove("active"));b.classList.add("active");render(cat)}
render();
</script></body></html>
